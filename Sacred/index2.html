<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sacred Gold | Mrs.Chairmode</title><style>
:root{color-scheme:dark;--bg:#101522;--panel:#1c2131;--panel2:#25283b;--gold:#d8b675;--mint:#8fd9ca;--muted:#aeb4c7;--border:#645a58}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0,#3a2d42 0,transparent 48%),radial-gradient(ellipse at 90% 80%,#163a37 0,transparent 55%),var(--bg);color:#f2edf7;font:15px system-ui,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}a{color:var(--gold)}main{max-width:1120px;margin:auto;padding:24px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.back{text-decoration:none;font-weight:700}.muted{color:var(--muted)}.hero{text-align:center;margin:25px auto 28px}.eyebrow{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold)}h1{font-size:clamp(34px,6vw,58px);margin:6px 0}h1 span{color:var(--gold)}.hero p{margin:6px 0;color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.stat,.card,.detail{background:#1b2030dc;border:1px solid #655b59;border-radius:14px;box-shadow:0 12px 28px #0003}.stat{padding:15px;text-align:center}.stat strong{display:block;color:var(--gold);font-size:24px}.stat span{font-size:12px;color:var(--muted)}.characters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{padding:16px;text-align:left;color:inherit;transition:.2s;border-color:#605765}.card:hover,.card:focus-visible{border-color:var(--gold);transform:translateY(-2px);outline:none}.card.active{border-color:var(--mint);box-shadow:0 0 0 1px #8fd9ca55}.card .glyph{width:54px;height:54px;border-radius:12px;background:linear-gradient(135deg,#544560,#252738);display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:800;color:#d8b675;overflow:hidden}.card .glyph img{width:100%;height:100%;object-fit:cover}.card .class{color:var(--gold);font-size:12px;margin:8px 0 4px}.card .name{font-size:19px;font-weight:750;overflow-wrap:anywhere}.card .progress{font-size:12px;color:var(--muted);margin-top:9px}.meter{height:6px;border-radius:20px;background:#37384a;overflow:hidden;margin-top:9px}.meter>span{display:block;height:100%;background:linear-gradient(90deg,#b49a65,#92d7c9)}.detail{margin-top:22px;padding:22px}.detail-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.portrait-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.portrait-tools input[type=file]{max-width:230px;font-size:12px}.detail-head h2{margin:0;font-size:26px}.detail-head p{margin:5px 0 0;color:var(--gold)}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}.panel{background:#151b29;border:1px solid #46465b;border-radius:12px;padding:17px}.panel h3{margin:0 0 14px;font-size:17px}.field{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}.field label{color:var(--muted);font-size:13px}.field input{background:#272c3e;border:1px solid #666078;color:#fff;border-radius:8px;padding:9px 11px;min-width:0}.field input[type=number]{width:95px}.field input[type=text]{width:210px;max-width:100%}.campaign{display:grid;grid-template-columns:95px repeat(5,minmax(0,1fr));gap:8px;align-items:center;margin:10px 0}.campaign .rowtitle{color:var(--gold);font-weight:700}.campaign label{display:flex;gap:5px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:12px}.campaign input,.item input{accent-color:#bca2e0;width:17px;height:17px}.campaign-header{display:grid;grid-template-columns:95px repeat(5,minmax(0,1fr));gap:8px;font-size:11px;text-align:center;color:var(--muted)}.equipment-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab,.smallbtn{background:#303145;color:#f3eaf9;border:1px solid #71637e;padding:8px 13px;border-radius:9px}.tab.active{border-color:var(--gold);color:var(--gold)}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #ffffff1c;padding:10px 2px}.item label{display:flex;gap:10px;align-items:center;min-width:0}.item .sub{font-size:11px;color:var(--muted)}.item .delete{background:transparent;color:#c6a5a9;border:0}.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed #666073;border-radius:10px}.add{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.add input,.add select{background:#292d40;color:#fff;border:1px solid #70647d;padding:9px;border-radius:8px;min-width:0}.add input{flex:2 1 160px}.add select{flex:1 1 120px}.add button,.action{background:#c9a7ed;color:#201728;border:0;border-radius:8px;padding:10px 14px;font-weight:750}.note{font-size:12px;color:var(--muted);margin:12px 0 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.smallbtn{font-size:12px}.footer{text-align:center;margin-top:28px;color:var(--muted);font-size:12px}input:focus-visible,button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}@media(max-width:850px){.characters{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}@media(max-width:470px){.characters{grid-template-columns:repeat(2,minmax(0,1fr))}.summary{gap:6px}.stat{padding:10px 5px}.stat strong{font-size:19px}.detail{padding:13px}.campaign,.campaign-header{grid-template-columns:73px repeat(5,minmax(0,1fr));gap:3px}.campaign label{font-size:10px}.campaign .rowtitle{font-size:12px}}
</style></head><body><main><div class="top"><a class="back" href="../index.html">← Game Hub</a><div class="toolbar"><button class="smallbtn" id="export">Export backup</button><button class="smallbtn" id="import">Import backup</button><input id="file" type="file" accept=".json,application/json" hidden></div></div><header class="hero"><div class="eyebrow">Mrs.Chairmode · Completion Tracker</div><h1>Sacred <span>Gold</span></h1><p>Character progress & equipment collection</p></header><section class="summary" id="summary"></section><section class="characters" id="characters" aria-label="Characters"></section><section class="detail" id="detail"></section><div class="footer">Saved locally in this browser · Export backups regularly</div></main><script>
'use strict';
const CLASSES=[['vampirin','Vampirin','Asmodina','V'],['kampfmagier','Kampfmagier','Myxin','K'],['zwerg','Zwerg','Gimli','Z'],['gladiator','Gladiator','Spartacus','G'],['seraphim','Seraphim','Luxanna','S'],['waldelfin','Waldelfin','Phoebe','W'],['daemonin','Dämonin','Lillith','D'],['dunkelelf','Dunkelelf','Dritzzt','D']];
const PORTRAIT_KEY='chairmode-sacred-portraits-v1';let portraits={};try{portraits=JSON.parse(localStorage.getItem(PORTRAIT_KEY)||'{}')||{}}catch{}
function portrait(id,letter){const url=portraits[id];return url?`<img src="${esc(url)}" alt="">`:letter}
const DIFF=['Bronze','Silber','Gold','Platin','Niob'],STORAGE='chairmode-sacred-gold-v1';
// The verified item catalogue will be added here later. No fictional item names are inserted.
const CATALOG=[];
const defaults=()=>Object.fromEntries(CLASSES.map(([id,klass,name])=>[id,{name,level:1,campaign:{Ankaria:[],Underworld:[]},owned:[],custom:[]}]));
let state=defaults(),selected='vampirin',tab='sets';
try{const raw=JSON.parse(localStorage.getItem(STORAGE)||'null');if(raw&&raw.characters)merge(raw.characters)}catch(e){console.warn('Saved Sacred state could not be read',e)}
function merge(data){for(const [id] of CLASSES){const s=data[id];if(!s||typeof s!=='object')continue;state[id].name=typeof s.name==='string'?s.name.slice(0,70):state[id].name;state[id].level=Number.isFinite(+s.level)?Math.max(1,Math.min(216,Math.trunc(+s.level))):1;for(const k of ['Ankaria','Underworld'])state[id].campaign[k]=Array.isArray(s.campaign?.[k])?s.campaign[k].filter(x=>DIFF.includes(x)):[];state[id].owned=Array.isArray(s.owned)?s.owned.filter(x=>typeof x==='string'):[];state[id].custom=Array.isArray(s.custom)?s.custom.filter(x=>x&&typeof x.id==='string'&&typeof x.name==='string'&&['sets','uniques'].includes(x.type)).map(x=>({id:x.id,name:x.name.slice(0,130),type:x.type,group:String(x.group||'').slice(0,100)})):[]}}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify({version:1,characters:state}))}catch(e){alert('Could not save to local storage. Please export a backup.')}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function items(id){return [...CATALOG.filter(x=>!x.classes||x.classes.includes(id)),...state[id].custom]}
function stats(id){const s=state[id],completed=Object.values(s.campaign).reduce((n,x)=>n+x.length,0),its=items(id),owned=its.filter(x=>s.owned.includes(x.id)).length;return{completed,owned,total:its.length}}
function render(){const sum=CLASSES.map(([id])=>stats(id));document.getElementById('summary').innerHTML=`<div class="stat"><strong>8</strong><span>Characters</span></div><div class="stat"><strong>${sum.reduce((a,x)=>a+x.completed,0)}/80</strong><span>Campaign completions</span></div><div class="stat"><strong>${sum.reduce((a,x)=>a+x.owned,0)}/${sum.reduce((a,x)=>a+x.total,0)}</strong><span>Equipment collected</span></div>`;document.getElementById('characters').innerHTML=CLASSES.map(([id,klass,name,emoji])=>{const s=state[id],st=stats(id);return `<button class="card ${id===selected?'active':''}" data-select="${id}"><div class="glyph">${portrait(id,emoji)}</div><div class="class">${klass}</div><div class="name">${esc(s.name||klass)}</div><div class="progress">Level ${s.level} · Campaigns ${st.completed}/10</div><div class="meter"><span style="width:${st.completed*10}%"></span></div><div class="progress">Equipment ${st.owned}/${st.total}</div></button>`}).join('');renderDetail()}
function renderDetail(){const s=state[selected],klass=CLASSES.find(x=>x[0]===selected)[1],all=items(selected).filter(x=>x.type===tab),st=stats(selected);document.getElementById('detail').innerHTML=`<div class="detail-head"><div><h2>${esc(s.name||klass)}</h2><p>${klass} · Level ${s.level}</p></div><span class="muted">Campaigns ${st.completed}/10 · Equipment ${st.owned}/${st.total}</span></div><div class="portrait-tools"><label for="portraitfile">Class portrait</label><input id="portraitfile" type="file" accept="image/png,image/jpeg,image/webp"><button class="smallbtn" id="clearportrait" type="button">Remove portrait</button></div><div class="field"><label for="charname">Character name</label><input id="charname" type="text" maxlength="70" value="${esc(s.name)}" aria-label="Editable character name"><button class="smallbtn" id="savename" type="button">Save name</button><label for="level">Character level</label><input id="level" type="number" min="1" max="216" value="${s.level}"></div><div class="two"><section class="panel"><h3>Campaign Completion</h3><div class="campaign-header"><span></span>${DIFF.map(d=>`<span>${d}</span>`).join('')}</div>${['Ankaria','Underworld'].map(k=>`<div class="campaign"><span class="rowtitle">${k}</span>${DIFF.map(d=>`<label title="${k} · ${d}"><input type="checkbox" data-campaign="${k}" data-diff="${d}" ${s.campaign[k].includes(d)?'checked':''}><span class="sr-only" style="position:absolute;clip-path:inset(100%)">${k} ${d}</span></label>`).join('')}</div>`).join('')}<p class="note">Each campaign and difficulty is tracked separately.</p></section><section class="panel"><h3>Equipment Collection · ${st.owned}/${st.total}</h3><div class="equipment-tabs"><button class="tab ${tab==='sets'?'active':''}" data-tab="sets">Green Set Items</button><button class="tab ${tab==='uniques'?'active':''}" data-tab="uniques">Gold Uniques</button></div><div>${all.length?all.map(x=>`<div class="item"><label><input type="checkbox" data-item="${esc(x.id)}" ${s.owned.includes(x.id)?'checked':''}><span>${esc(x.name)}${x.group?`<div class="sub">${esc(x.group)}</div>`:''}</span></label>${s.custom.some(c=>c.id===x.id)?`<button class="delete" title="Remove entry" data-remove="${esc(x.id)}">✕</button>`:''}</div>`).join(''):`<div class="empty">No items in this collection yet.</div>`}</div><form id="add" class="add"><input name="name" maxlength="130" placeholder="German item name" required aria-label="Item name"><input name="group" maxlength="100" placeholder="Set name (optional)" aria-label="Set name"><button type="submit">+ Add item</button></form><p class="note">Manual entries are saved per character. The verified German item catalogue will be integrated separately.</p></section></div>`;const saveName=()=>{state[selected].name=document.getElementById('charname').value.trim().slice(0,70)||klass;save();render()};document.getElementById('charname').addEventListener('change',saveName);document.getElementById('charname').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();saveName()}});document.getElementById('savename').addEventListener('click',saveName);document.getElementById('portraitfile').addEventListener('change',e=>{const file=e.target.files?.[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)){alert('Please choose PNG, JPG or WebP.');return}const reader=new FileReader();const id=selected;reader.onload=()=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');canvas.width=160;canvas.height=160;const ctx=canvas.getContext('2d');const scale=Math.max(160/img.width,160/img.height);ctx.drawImage(img,(160-img.width*scale)/2,(160-img.height*scale)/2,img.width*scale,img.height*scale);portraits[id]=canvas.toDataURL('image/jpeg',.8);try{localStorage.setItem(PORTRAIT_KEY,JSON.stringify(portraits));render()}catch{alert('Image could not be saved in browser storage.')}};img.src=reader.result};reader.readAsDataURL(file)});document.getElementById('clearportrait').addEventListener('click',()=>{delete portraits[selected];localStorage.setItem(PORTRAIT_KEY,JSON.stringify(portraits));render()});document.getElementById('level').addEventListener('change',e=>{state[selected].level=Math.max(1,Math.min(216,Math.trunc(Number(e.target.value)||1)));save();render()});document.querySelectorAll('[data-campaign]').forEach(el=>el.addEventListener('change',e=>{const {campaign,diff}=e.target.dataset;let a=state[selected].campaign[campaign];state[selected].campaign[campaign]=e.target.checked?[...new Set([...a,diff])]:a.filter(x=>x!==diff);save();render()}));document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{tab=el.dataset.tab;renderDetail()}));document.querySelectorAll('[data-item]').forEach(el=>el.addEventListener('change',e=>{const id=e.target.dataset.item;const a=state[selected].owned;state[selected].owned=e.target.checked?[...new Set([...a,id])]:a.filter(x=>x!==id);save();render()}));document.querySelectorAll('[data-remove]').forEach(el=>el.addEventListener('click',()=>{if(!confirm('Remove this custom entry?'))return;const id=el.dataset.remove;state[selected].custom=state[selected].custom.filter(x=>x.id!==id);state[selected].owned=state[selected].owned.filter(x=>x!==id);save();render()}));document.getElementById('add').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),name=String(f.get('name')||'').trim(),group=String(f.get('group')||'').trim();if(!name)return;if(items(selected).some(x=>x.name.toLocaleLowerCase('de')===name.toLocaleLowerCase('de')&&x.type===tab)){alert('This item is already listed.');return}state[selected].custom.push({id:'custom-'+(crypto.randomUUID?.()||Date.now()+'-'+Math.random()),name,group,type:tab});save();render()})}
document.getElementById('characters').addEventListener('click',e=>{const btn=e.target.closest('[data-select]');if(btn){selected=btn.dataset.select;tab='sets';render()}});
document.getElementById('export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({app:'chairmode-sacred-gold',version:1,exportedAt:new Date().toISOString(),characters:state,portraits},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sacred-gold-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
document.getElementById('import').addEventListener('click',()=>document.getElementById('file').click());document.getElementById('file').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.app!=='chairmode-sacred-gold'||!data.characters||data.version!==1)throw Error('Invalid Sacred Gold backup');if(!confirm('Replace all Sacred Gold progress with this backup?'))return;state=defaults();merge(data.characters);if(data.portraits&&typeof data.portraits==='object'){portraits=data.portraits;try{localStorage.setItem(PORTRAIT_KEY,JSON.stringify(portraits))}catch{}}save();render();alert('Backup imported.')}catch(err){alert('Import failed: '+err.message)}finally{e.target.value=''}});render();
</script></body></html>
