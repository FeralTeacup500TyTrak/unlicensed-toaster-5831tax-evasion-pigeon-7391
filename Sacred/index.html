function renderDetail(){const s=state[selected],klass=CLASSES.find(x=>x[0]===selected)[1],st=stats(selected);document.getElementById('detail').innerHTML=`<div class="detail-head"><div><h2>${esc(s.name||klass)}</h2><p>${klass} · Level ${s.level}</p></div><span class="muted">Campaigns ${st.completed}/10 · Equipment ${st.owned}/${st.total}</span></div><div class="portrait-tools"><label for="portraitfile">Class portrait</label><input id="portraitfile" type="file" accept="image/png,image/jpeg,image/webp"><button class="smallbtn" id="clearportrait" type="button">Remove portrait</button></div><div class="field"><label for="charname">Character name</label><input id="charname" type="text" maxlength="70" value="${esc(s.name)}" aria-label="Editable character name"><button class="smallbtn" id="savename" type="button">Save name</button><label for="level">Character level</label><input id="level" type="number" min="1" max="216" value="${s.level}"></div><div class="two collection-layout"><div class="collection-left"><section class="panel"><h3>Campaign Completion</h3><div class="campaign-header"><span></span>${DIFF.map(d=>`<span>${d}</span>`).join('')}</div>${['Ankaria','Underworld'].map(k=>`<div class="campaign"><span class="rowtitle">${k}</span>${DIFF.map(d=>`<label title="${k} · ${d}"><input type="checkbox" data-campaign="${k}" data-diff="${d}" ${s.campaign[k].includes(d)?'checked':''}><span class="sr-only" style="position:absolute;clip-path:inset(100%)">${k} ${d}</span></label>`).join('')}</div>`).join('')}</section><section class="panel collection-nav"><h3>Equipment Collection · ${st.owned}/${st.total}</h3><h4 class="nav-heading">Green Sets</h4><div class="collection-links">${setGroups(selected).map(g=>`<button type="button" class="collection-link ${selectionKey==='set:'+g.index?'active':''} ${collectionProgress(g.entries.filter(x=>s.owned.includes(x.id)).length,g.entries.length)}" data-collection="set:${g.index}"><span>${setTitle(g)}</span><small>${g.entries.filter(x=>s.owned.includes(x.id)).length}/${g.entries.length}</small></button>`).join('')}</div><h4 class="nav-heading">Gold Uniques</h4><div class="collection-links">${uniqueGroups(selected).map(g=>`<button type="button" class="collection-link ${selectionKey==='unique:'+g?'active':''} ${collectionProgress(items(selected).filter(x=>x.type==='uniques'&&x.group===g&&s.owned.includes(x.id)).length,items(selected).filter(x=>x.type==='uniques'&&x.group===g).length)}" data-collection="unique:${esc(g)}"><span>${esc(g)}</span><small>${items(selected).filter(x=>x.type==='uniques'&&x.group===g&&s.owned.includes(x.id)).length}/${items(selected).filter(x=>x.type==='uniques'&&x.group===g).length}</small></button>`).join('')}</div></section></div><section class="panel collection-details" id="collection-details">${renderCollectionDetails(selected)}</section></div>`;const saveName=()=>{state[selected].name=document.getElementById('charname').value.trim().slice(0,70)||klass;save();render()};document.getElementById('charname').addEventListener('change',saveName);document.getElementById('charname').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();saveName()}});document.getElementById('savename').addEventListener('click',saveName);document.getElementById('portraitfile').addEventListener('change',e=>{const file=e.target.files?.[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)){alert('Please choose PNG, JPG or WebP.');return}const reader=new FileReader();const id=selected;reader.onload=()=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');canvas.width=160;canvas.height=160;const ctx=canvas.getContext('2d');const scale=Math.max(160/img.width,160/img.height);ctx.drawImage(img,(160-img.width*scale)/2,(160-img.height*scale)/2,img.width*scale,img.height*scale);portraits[id]=canvas.toDataURL('image/jpeg',.8);try{localStorage.setItem(PORTRAIT_KEY,JSON.stringify(portraits));render()}catch{alert('Image could not be saved in browser storage.')}};img.src=reader.result};reader.readAsDataURL(file)});document.getElementById('clearportrait').addEventListener('click',()=>{delete portraits[selected];localStorage.setItem(PORTRAIT_KEY,JSON.stringify(portraits));render()});document.getElementById('level').addEventListener('change',e=>{state[selected].level=Math.max(1,Math.min(216,Math.trunc(Number(e.target.value)||1)));save();render()});document.querySelectorAll('[data-campaign]').forEach(el=>el.addEventListener('change',e=>{const {campaign,diff}=e.target.dataset;let a=state[selected].campaign[campaign];state[selected].campaign[campaign]=e.target.checked?[...new Set([...a,diff])]:a.filter(x=>x!==diff);save();render()}));document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{tab=el.dataset.tab;filterGroup='All';renderDetail()}));document.querySelectorAll('[data-group]').forEach(el=>el.addEventListener('click',()=>{filterGroup=el.dataset.group;renderDetail()}));document.querySelectorAll('[data-collection]').forEach(el=>el.addEventListener('click',()=>{selectionKey=el.dataset.collection;renderDetail()}));document.querySelectorAll('[data-discover]').forEach(el=>el.addEventListener('click',()=>{const id=el.dataset.discover,x=CATALOG.find(x=>x.id===id);if(!x)return;const answer=prompt('Enter the exact German item name to discover it:');if(answer===null)return;if(answer.trim().toLocaleLowerCase('de')===x.name.toLocaleLowerCase('de')){discovered[id]=x.name;saveDiscovery();state[selected].owned=[...new Set([...state[selected].owned,id])];save();render()}else alert('Name does not match. Item remains undiscovered.')}));document.querySelectorAll('[data-item]').forEach(el=>el.addEventListener('change',e=>{const id=e.target.dataset.item;const a=state[selected].owned;state[selected].owned=e.target.checked?[...new Set([...a,id])]:a.filter(x=>x!==id);save();render()}));document.querySelectorAll('[data-remove]').forEach(el=>el.addEventListener('click',()=>{if(!confirm('Remove this custom entry?'))return;const id=el.dataset.remove;state[selected].custom=state[selected].custom.filter(x=>x.id!==id);state[selected].owned=state[selected].owned.filter(x=>x!==id);save();render()}));document.getElementById('add').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),name=String(f.get('name')||'').trim(),group=String(f.get('group')||'').trim();if(!name)return;if(items(selected).some(x=>x.name.toLocaleLowerCase('de')===name.toLocaleLowerCase('de')&&x.type===tab)){alert('This item is already listed.');return}state[selected].custom.push({id:'custom-'+(crypto.randomUUID?.()||Date.now()+'-'+Math.random()),name,group,type:tab});save();render()})}
document.getElementById('characters').addEventListener('click',e=>{const btn=e.target.closest('[data-select]');if(btn){selected=btn.dataset.select;selectionKey='';tab='sets';filterGroup='All';render()}});
document.getElementById('export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({app:'chairmode-sacred-gold',version:1,exportedAt:new Date().toISOString(),characters:state,portraits,discovered},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sacred-gold-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
document.getElementById('import').addEventListener('click',()=>document.getElementById('file').click());document.getElementById('file').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.app!=='chairmode-sacred-gold'||!data.characters||data.version!==1)throw Error('Invalid Sacred Gold backup');if(!confirm('Replace all Sacred Gold progress with this backup?'))return;state=defaults();merge(data.characters);if(data.portraits&&typeof data.portraits==='object'){portraits=data.portraits;try{localStorage.setItem(PORTRAIT_KEY,JSON.stringify(portraits))}catch{}}if(data.discovered&&typeof data.discovered==='object'){discovered=data.discovered;saveDiscovery()}save();render();alert('Backup imported.')}catch(err){alert('Import failed: '+err.message)}finally{e.target.value=''}});render();
</script></body></html>
